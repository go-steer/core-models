# Qwen3-Coder-30B-A3B in FP8 (~31 GB): the fallback if a model's
# kernels misbehave on this GPU, with room for a large KV cache.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: {kind: Deployment, name: vllm}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8
          - --tool-call-parser=qwen3_coder
          - --enable-auto-tool-choice
          # Report cached prompt tokens per request (usage.prompt_tokens_details).
          - --enable-prompt-tokens-details
          - --max-model-len=65536
          - --gpu-memory-utilization=0.90
