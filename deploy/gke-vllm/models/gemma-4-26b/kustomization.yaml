# Gemma 4 26B-A4B (MoE, 4B active) in BF16, ~52 GB: fits one 96 GB
# RTX PRO 6000 with room for KV cache. Apache 2.0 and ungated, so no
# Hugging Face token is needed. Vertex AI also serves it
# (google/gemma-4-26b-a4b-it-maas), so the same weights can be measured
# self-hosted and managed. Flags follow vLLM's Gemma 4 recipe, except
# --chat-template: the model's own template (chat_template.jinja in the
# Hugging Face repo) is used. It carries Google's fixes for tool-calling
# loops and turn closures; the example template bundled with vLLM 0.31
# predates them, and with it the model repeated tool calls far more.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: {kind: Deployment, name: vllm}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - google/gemma-4-26B-A4B-it
          - --tool-call-parser=gemma4
          - --reasoning-parser=gemma4
          - --enable-auto-tool-choice
          - --enable-prompt-tokens-details
          - --max-model-len=65536
          - --gpu-memory-utilization=0.90
