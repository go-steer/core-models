# An internal passthrough load balancer in front of vLLM: reachable
# only inside the VPC, and the backend a PSC ServiceAttachment needs.
# /v1/* requires the API key; /health and /metrics do not.
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: core-models
  annotations:
    networking.gke.io/load-balancer-type: "Internal"
spec:
  type: LoadBalancer
  selector: {app: vllm}
  ports:
    - {name: http, port: 8000, targetPort: http}
