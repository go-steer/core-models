# Publishes the internal load balancer through Private Service Connect,
# so a consumer in another project (or org) reaches vLLM at an internal
# IP of its own, with no VPC peering and no public endpoint.
#
# Needs a subnet with purpose PRIVATE_SERVICE_CONNECT in the cluster's
# region (natSubnets below). The consumer allow-list is a placeholder;
# set your consumer project in a local overlay rather than committing it.
apiVersion: networking.gke.io/v1
kind: ServiceAttachment
metadata:
  name: vllm
  namespace: core-models
spec:
  connectionPreference: ACCEPT_MANUAL
  natSubnets: ["core-models-psc-nat"]
  proxyProtocol: false
  resourceRef:
    kind: Service
    name: vllm
  consumerAllowList:
    - project: CONSUMER-PROJECT-ID
      connectionLimit: 2
