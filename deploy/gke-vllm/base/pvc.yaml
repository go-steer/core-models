# Model weights, kept across pod restarts. G4 (RTX PRO 6000) nodes
# have ~47 GB of allocatable ephemeral storage, less than
# gpt-oss-120b's ~65 GB of weights. dynamic-rwo picks the disk type the
# node's machine family supports (Hyperdisk on G4).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-models
  namespace: core-models
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: dynamic-rwo
  resources:
    requests:
      storage: 200Gi
