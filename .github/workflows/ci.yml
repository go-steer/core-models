# CI for core-models. Every step runs a script under dev/ci/presubmits/
# — the same scripts dev/ci/presubmits/all.sh runs locally — so a local
# presubmit pass is a CI pass (AGENTS.md house rule #6). Don't add
# inline check steps here; add a script under dev/ci/presubmits/, wire
# it into a job below AND into all.sh's steps list. Same shape as
# mast's and core-agent's ci.yml.
#
# Every Go script iterates the modules listed in dev/tools/common.sh
# (the core module, adkv1, adkv2), so a new nested module needs no
# change here.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - name: Build
        run: dev/ci/presubmits/build.sh
      - name: Vet
        run: dev/ci/presubmits/vet.sh
      - name: Format
        run: dev/ci/presubmits/fmt.sh
      - name: Test (-race)
        run: dev/ci/presubmits/test.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      # Cache the compiled golangci-lint binary. Keep the key's version
      # in sync with GOLANGCI_LINT_VERSION in dev/tools/lint-go —
      # ensure_tool finds the cached binary on GOBIN and skips the
      # (slow, from-source) go install.
      - uses: actions/cache@v6
        with:
          path: ~/go/bin/golangci-lint
          key: ${{ runner.os }}-golangci-lint-v2.12.1
      - name: golangci-lint
        run: dev/ci/presubmits/lint.sh

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - uses: actions/cache@v6
        with:
          path: ~/go/bin/govulncheck
          key: ${{ runner.os }}-govulncheck
      - name: go mod tidy is clean
        run: dev/ci/presubmits/mod-tidy.sh
      - name: govulncheck
        run: dev/ci/presubmits/vuln.sh
      - name: core module imports no ADK
        run: dev/ci/presubmits/core-no-adk.sh
      - name: adkv1 and adkv2 in lockstep
        run: dev/ci/presubmits/shims-lockstep.sh
      - name: shell-lint
        run: dev/ci/presubmits/shell-lint.sh
