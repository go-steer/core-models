# Dependabot version updates, same schedule and grouping as mast's.
# Minor and patch bumps are grouped into one PR per ecosystem; majors
# arrive ungrouped, one PR each, for a human.
#
# One Go entry covers every module. Note what a bump in the core module
# means here that it does not mean in mast or core-agent: the core's
# requirements are FLOORS its consumers inherit (AGENTS.md, "Dependency
# floors"). A genai or anthropic-sdk-go bump in the core module moves
# both products' minimum, so it is reviewed as that, not as a patch.

version: 2

updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /adkv1
      - /adkv2
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      go-security:
        applies-to: security-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /docs/site
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      docs-site-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
